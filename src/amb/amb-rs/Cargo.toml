[package]
name = "amb-rs"
description = "AMB Container Editor"
version = "0.9.0"
edition = "2024"
authors = ["Oleg \"OSA413\" Sokolov"]
repository = "https://github.com/OSA413/Sonic4_Tools"
homepage = "https://github.com/OSA413/Sonic4_Tools"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
amb-rs-lib = { path = "../amb-rs-lib" }
common_utils = { path = "../../common/utils" }
common_binary = { path = "../../common/binary" }

[dev-dependencies]
serde = "1.0.228"
serde_json = "1.0.150"
amb-rs-tests = { path = "../amb-rs-tests" }
assert_cmd = "2.2.2"
predicates = "3.1.4"

[build-dependencies]
winresource = "0.1.31"
svg_to_ico = "1.3.1"
